<!DOCTYPE html><html lang="es"><head><title>Condominio | Registro de Visitas</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet"><link href="css/styles.css" rel="stylesheet">
<script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script><script>Auth.requireLogin()</script></head><body>
<div class="topbar"><i class="bi bi-lock-fill"></i> Control de Acceso y Seguridad 24/7</div>
<nav class="navbar navbar-expand-md"><div class="container"><span class="navbar-brand brand"><img src="img/logo.svg" width="30" alt=""> Condominio</span>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#m" aria-label="Menú"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="m">
<div class="d-md-none border-bottom py-2 mb-1 fw-bold"><i class="bi bi-person-circle uicon fs-4"></i> <span class="uname"></span></div>
<ul class="navbar-nav me-auto">
<li><button class="nav-link active" data-sec="registro"><i class="bi bi-journal-plus"></i> Registro de Visitas</button></li>
<li><button class="nav-link" data-sec="listado"><i class="bi bi-list-ul"></i> Listado de Visitas</button></li>
<li class="d-md-none"><button class="nav-link text-danger" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li></ul>
<div class="dropdown d-none d-md-block"><button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle uicon fs-5"></i> <span class="uname"></span></button>
<ul class="dropdown-menu dropdown-menu-end"><li><button class="dropdown-item text-danger" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button></li></ul></div>
</div></div></nav>
<main class="flex-fill">
<section id="sec-registro" class="container py-4"><div class="card shadow-sm mx-auto" style="max-width:760px"><div class="card-body p-4">
<h2 class="h4 mb-3">Registro de Visitas</h2>
<form id="f" novalidate class="row g-3">
<div class="col-md-6"><label class="form-label" for="rut">RUT *</label><input id="rut" class="form-control" maxlength="12" placeholder="12.345.678-9" autocomplete="off"><div class="invalid-feedback">RUT no válido</div></div>
<div class="col-md-6"></div>
<div class="col-md-6"><label class="form-label" for="nombre">Nombre *</label><input id="nombre" class="form-control" autocomplete="off"><div class="invalid-feedback">Solo letras</div></div>
<div class="col-md-6"><label class="form-label" for="apellidos">Apellidos *</label><input id="apellidos" class="form-control" autocomplete="off"><div class="invalid-feedback">Solo letras</div></div>
<div class="col-12"><div class="form-check"><input type="checkbox" id="veh" class="form-check-input"><label class="form-check-label" for="veh">Viene en vehículo</label></div></div>
<div class="col-md-6 d-none" id="patw"><label class="form-label" for="pat">Patente *</label><input id="pat" class="form-control text-uppercase" maxlength="7" placeholder="ABCD12" autocomplete="off"><div class="invalid-feedback">Patente obligatoria (5 a 7 caracteres)</div></div>
<div class="col-md-6"><label class="form-label" for="depto">Departamento *</label><select id="depto" class="form-select"><option value="">Seleccione…</option></select><div class="invalid-feedback">Seleccione un departamento</div></div>
<div class="col-md-6"><label class="form-label" for="torre">Torre *</label><select id="torre" class="form-select"><option value="">Seleccione…</option></select><div class="invalid-feedback">Seleccione una torre</div></div>
<div class="col-12"><label class="form-label" for="obs">Observación</label><textarea id="obs" class="form-control" rows="5" maxlength="300"></textarea><div class="form-text text-end"><span id="cnt">0</span>/300</div></div>
<div class="col-12"><button id="btn" class="btn btn-c btn-lg w-100">Registrar visita</button></div></form>
<div id="msg" class="mt-3"></div></div></div></section>
<section id="sec-listado" class="container py-4 d-none"><div class="card shadow-sm"><div class="card-body">
<div class="d-flex flex-wrap gap-2 justify-content-between mb-3"><h2 class="h4 m-0">Listado de Visitas</h2>
<div class="d-flex gap-2"><input id="q" class="form-control" placeholder="Buscar…"><!-- Botón Actualizar oculto: para mostrarlo, quite la clase d-none -->
<button id="rf" class="btn btn-c d-none" title="Actualizar"><i class="bi bi-arrow-clockwise"></i></button></div></div>
<div class="table-responsive"><table class="table table-striped table-hover align-middle small"><thead id="th"></thead><tbody id="tb"></tbody></table></div>
<div id="cn" class="text-secondary small"></div></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script></body></html>
